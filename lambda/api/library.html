<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>回忆相簿 · 胡佳与德威</title><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/library.css"><link rel="stylesheet" href="/edit-conflict.css"><script src="/edit-conflict.js" defer></script><script src="/library.js" defer></script></head><body><header class="site"><div class="brand-row"><a class="logo" href="https://dliu.com"><img src="/icon.png" width="36" height="36" alt="DL"></a><a class="brand" href="/">胡佳 · 德威</a></div><nav class="site-nav"><a href="/api/preview">回忆册</a><a href="/about">关于</a><a href="/auth/logout">退出</a></nav></header><main class="library-shell"><aside class="library-sidebar"><h1>慢慢收起来的日子</h1><div class="filters"><input id="memory-search" type="search" placeholder="找一段回忆" aria-label="找一段回忆"><select id="year-filter" aria-label="选择年份"><option value="">所有年份</option></select></div><div id="memory-list" class="memory-list" aria-label="我们的回忆"></div><button id="new-memory" type="button" class="button">＋ 留下一段回忆</button></aside><p id="empty-detail" class="muted">正在翻开我们的相簿……</p><section id="detail" class="library-detail" hidden><div class="media-column"><div id="memory-media" class="memory-media"></div><nav class="photo-navigation" aria-label="照片导航"><button id="photo-prev" type="button">← 上一张</button><span id="photo-count"></span><button id="photo-next" type="button">下一张 →</button></nav><p id="media-status" class="status" role="status"></p></div><div class="memory-text"><p id="memory-date" class="kicker"></p><h2 id="memory-title"></h2><p id="memory-caption" class="caption"></p><div id="document-originals" class="memory-actions"></div><button id="edit-memory" type="button" class="button">调整这段回忆</button><label for="perspective">你记得的那一天</label><textarea id="perspective" maxlength="5000" placeholder="把你记得的，也写在这里……"></textarea><button id="save-perspective" type="button" class="button primary">把这句话收好</button><p id="save-status" class="status" role="status"></p><label class="upload-label" for="upload-files">再放几张照片，或一段视频<input id="upload-files" type="file" multiple accept="image/jpeg,image/png,image/gif,image/webp,image/avif,image/heic,image/heif,video/mp4,video/quicktime,video/webm,video/x-m4v,video/3gpp"></label><p id="upload-status" class="status" role="status"></p></div></section></main><dialog id="edit-dialog" class="edit-dialog" aria-labelledby="edit-heading"><h2 id="edit-heading"></h2><label>这一段叫什么<input id="edit-title" maxlength="150" required></label><div class="date-place"><label>日期<input id="edit-date" type="date" required></label><label>地点<input id="edit-place" maxlength="200" placeholder="例如 Belfast"></label></div><label for="edit-caption">那天的故事</label><textarea id="edit-caption" maxlength="5000"></textarea><label><input id="edit-published" type="checkbox"> 放进我们的相簿</label><p id="editor-status" class="status" role="status"></p><div class="edit-actions"><button id="edit-save" type="button" class="button primary">收好</button><button id="edit-cancel" type="button" class="button">先不改</button></div></dialog></body></html>
